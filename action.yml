name: ADS external bootstrap evaluator
description: Read one Harness pull request as data, obtain bounded Claude review, and publish a distinct dedicated-App status.
inputs:
  claude-bin:
    description: Absolute path to the caller-installed, integrity-verified Claude binary.
    required: true
outputs:
  result:
    description: Strict, identity-bound external review result for the trusted caller to publish.
    value: ${{ steps.evaluate.outputs.result }}
runs:
  using: composite
  steps:
    - name: Evaluate source-only pull request
      id: evaluate
      shell: bash
      env:
        ADS_CLAUDE_BIN: ${{ inputs.claude-bin }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/src/evaluate.py" \
          --event-path "$GITHUB_EVENT_PATH" \
          --claude-bin "$ADS_CLAUDE_BIN"
